name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publish.yml]

permissions: {}

concurrency:
  group: dsh-fish-pay-counter-release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate and pack
        id: pack
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node --check index.js
          node --check client.js
          git diff --check "$BEFORE" HEAD
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node <<'JS'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const p = require('./package.json');
          const [pack] = require(process.env.RUNNER_TEMP + '/pack.json');
          const old = JSON.parse(execFileSync('git', ['show', process.env.BEFORE + ':package.json'], {encoding: 'utf8'}));
          const semver = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          if (p.name !== 'dsh-fish-pay-counter' || !semver.test(p.version) || !semver.test(old.version)) {
            throw new Error('Expected the fish package and a stable three-part version');
          }
          const required = ['package.json', 'LICENSE', 'README.md', 'index.js', 'client.js', 'cordis.patch.yml', 'icon.png'];
          const previews = JSON.parse(fs.readFileSync('screenshots.json', 'utf8'));
          const paths = new Set(pack.files.map(f => f.path));
          const allowed = /^(LICENSE|README\.md|package\.json|index\.js|client\.js|cordis\.patch\.yml|icon\.png|screenshots\.json|locale\/[\w-]+\.json|docs\/[\w.-]+\.md|market-assets\/[\w.-]+\.png)$/;
          if (![...required, 'screenshots.json', ...previews].every(f => paths.has(f)) || ![...paths].every(f => allowed.test(f))) {
            throw new Error('Missing expected assets or unexpected files in the npm tarball');
          }
          const current = p.version.split('.').map(BigInt);
          const previous = old.version.split('.').map(BigInt);
          const changedAt = current.findIndex((n, i) => n !== previous[i]);
          if (changedAt !== -1 && current[changedAt] < previous[changedAt]) throw new Error('Version regressed');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            'version=' + p.version, 'filename=' + pack.filename, 'integrity=' + pack.integrity,
            'release=' + String(changedAt !== -1), '',
          ].join('\n'));
          JS

      - name: Publish and check the official registry
        if: steps.pack.outputs.release == 'true'
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          FILE: ${{ steps.pack.outputs.filename }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          registry=https://registry.npmjs.org
          endpoint="$registry/dsh-fish-pay-counter/$VERSION"
          response="$RUNNER_TEMP/npm-version.json"
          checksum() { node -p 'require(process.argv[1]).dist.integrity' "$response"; }
          code=$(curl -sS --retry 2 --max-time 15 -o "$response" -w '%{http_code}' "$endpoint")
          if [[ "$code" == 200 ]]; then
            [[ "$(checksum)" == "$INTEGRITY" ]]
          elif [[ "$code" == 404 ]]; then
            curl -fsS --retry 2 --max-time 15 -o "$response" "$registry/dsh-fish-pay-counter/latest"
            node -e '
              const previous = require(process.argv[1]).version.split(".").map(BigInt);
              const next = process.env.VERSION.split(".").map(BigInt);
              const at = next.findIndex((part, i) => part !== previous[i]);
              if (at < 0 || next[at] < previous[at]) throw new Error("Publish would move npm latest backward");
            ' "$response"
            npm publish "$RUNNER_TEMP/$FILE" --registry "$registry" --access public --ignore-scripts
          else
            echo "::error::npm metadata returned HTTP $code"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 -o "$response" "$endpoint" && [[ "$(checksum)" == "$INTEGRITY" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not verify the bytes of the published npm package"
          exit 1

      - name: Publish GitHub Release
        if: steps.pack.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
          FILE: ${{ steps.pack.outputs.filename }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release download "$tag" --pattern "$FILE" --output "$RUNNER_TEMP/released.tgz"
            cmp "$RUNNER_TEMP/$FILE" "$RUNNER_TEMP/released.tgz"
          else
            gh release create "$tag" "$RUNNER_TEMP/$FILE" --target "$GITHUB_SHA" \
              --title "$tag" --notes "Install: dsh plugin --profile desktop add dsh-fish-pay-counter@$VERSION"
          fi

      - name: Check the npm mirror
        if: steps.pack.outputs.release == 'true'
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          response="$RUNNER_TEMP/mirror.json"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 -o "$response" "https://registry.npmmirror.com/dsh-fish-pay-counter/$VERSION" &&
              [[ "$(node -p 'require(process.argv[1]).dist.integrity' "$response")" == "$INTEGRITY" ]]; then
              echo 'npm mirror matches the official package.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'The official npm package is live. This run could not confirm the same version and checksum on the npm mirror.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::npm mirror has not been verified'
